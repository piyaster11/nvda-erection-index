name: Update Erection Index

on:
  schedule:
    # 17:00 America/New_York after the regular-session close (21:00 UTC in winter, 22:00 in summer).
    # Running at 22:00 UTC covers both, about an hour after the close in winter.
    - cron: "0 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/compute_index.py"
      - ".github/workflows/update-index.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute index from Yahoo Finance
        run: python scripts/compute_index.py

      - name: Commit if the reading changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/index.json
          if git diff --staged --quiet; then
            echo "Index unchanged."
          else
            git commit -m "chore: update NVDA erection index"
            git push
          fi
